openapi: 3.0.3
info:
  title: Double-Entry Ledger API
  version: 1.0.0
  description: >-
    Current routes are implemented and documented below. Planned capabilities are
    listed separately and are not callable until implemented and published.
servers:
  - url: http://localhost:8101
paths:
  /v1/accounts:
    post:
      operationId: createAccount
      summary: Explicitly provision an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, currency, type]
              properties:
                account_id: { type: string, format: uuid }
                owner_id: { type: string }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                type: { type: string, enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE] }
      responses:
        '201': { description: Account created or identical account already exists }
        '400': { description: Invalid account attributes or ID conflict }
  /v1/transactions:
    post:
      operationId: postTransaction
      summary: Record a balanced transaction
      description: Legacy behavior: duplicate idempotency keys and validation errors return HTTP 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key, entries]
              properties:
                idempotency_key: { type: string }
                description: { type: string }
                entries:
                  type: array
                  items:
                    type: object
                    required: [account_id, amount, direction, currency]
                    properties:
                      account_id: { type: string, format: uuid }
                      amount: { type: string, description: Exact decimal; JSON decimal input is accepted by the implementation. }
                      direction: { type: string, enum: [DEBIT, CREDIT] }
                      currency: { type: string, pattern: '^[A-Z]{3}$' }
      responses:
        '200':
          description: Transaction posted
          content:
            application/json:
              schema:
                type: object
                required: [transaction_id]
                properties:
                  transaction_id: { type: string, format: uuid }
        '400': { description: Invalid JSON, account id, unbalanced post, or reused idempotency key }
  /v1/transactions/{id}:
    get:
      operationId: getTransactionByID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Transaction and journal entries }
        '400': { description: Invalid transaction UUID }
        '404': { description: Transaction not found }
  /v1/transactions/by-idempotency-key/{key}:
    get:
      operationId: getTransactionByIdempotencyKey
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string }
      responses:
        '200': { description: Transaction and journal entries }
        '404': { description: Transaction not found }
  /v1/accounts/{id}/balance:
    get:
      operationId: getAccountBalance
      summary: Read an account balance
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Current account balance }
        '400': { description: Account id is not a UUID }
        '500': { description: Balance query failed }
x-planned-capabilities:
  description: Not implemented in this API version; these routes are roadmap only.
  items:
    - GET /v1/accounts/{id}/entries
    - GET /v1/accounts/{id}/balance?as_of={timestamp}
    - GET /v1/trial-balance
    - GET /v1/transactions/{id}
    - GET /v1/transactions/by-idempotency-key/{key}
    - POST /v1/transactions/{id}/reversals
