openapi: 3.0.3
info:
  title: Double-Entry Ledger API
  version: 1.0.0
  description: >-
    Current routes are implemented and documented below. Planned capabilities are
    listed separately and are not callable until implemented and published.
servers:
  - url: http://localhost:8101
paths:
  /v1/accounts:
    post:
      operationId: createAccount
      summary: Explicitly provision an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, currency, type]
              properties:
                account_id: { type: string, format: uuid }
                owner_id: { type: string }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                type: { type: string, enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE] }
      responses:
        '201':
          description: Account created or identical account already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/transactions:
    post:
      operationId: postTransaction
      summary: Record a balanced transaction
      description: >-
        A same-key, same-payload retry returns the original transaction; changed
        payload conflicts with HTTP 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key, entries]
              properties:
                idempotency_key: { type: string }
                expected_versions:
                  type: object
                  additionalProperties: { type: integer, format: int64, minimum: 0 }
                  description: Optional account_id to version preconditions; stale versions return 409.
                description: { type: string }
                entries:
                  type: array
                  items:
                    type: object
                    required: [account_id, amount, direction, currency]
                    properties:
                      account_id: { type: string, format: uuid }
                      amount: { type: string, description: Exact decimal; JSON decimal input is accepted by the implementation. }
                      direction: { type: string, enum: [DEBIT, CREDIT] }
                      currency: { type: string, pattern: '^[A-Z]{3}$' }
      responses:
        '200':
          description: Transaction posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/transactions/{id}:
    get:
      operationId: getTransactionByID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Transaction and journal entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/transactions/by-idempotency-key/{key}:
    get:
      operationId: getTransactionByIdempotencyKey
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Transaction and journal entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/transactions/{id}/reversals:
    post:
      operationId: reverseTransaction
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key]
              properties:
                idempotency_key: { type: string }
      responses:
        '200':
          description: Reversal transaction ID; retries return the original result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/accounts/{id}:
    get:
      operationId: getAccount
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Account definition and current concurrency version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/accounts/{id}/entries:
    get:
      operationId: getAccountEntries
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
        - in: query
          name: offset
          schema: { type: integer, default: 0, minimum: 0 }
        - in: query
          name: cursor
          description: Opaque exclusive cursor returned in X-Next-Cursor; stable across later appends.
          schema: { type: string }
      responses:
        '200':
          description: Account entries in deterministic order; offset pages may shift, cursor pages continue after the last returned entry.
          headers:
            X-Next-Cursor:
              description: Opaque continuation cursor when another page exists.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Entry' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/trial-balance:
    get:
      operationId: getTrialBalance
      responses:
        '200':
          description: Per-account debit-minus-credit balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrialBalanceRow' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/accounts/{id}/balance:
    get:
      operationId: getAccountBalance
      summary: Read an account balance
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: as_of
          description: Optional RFC3339 timestamp; returns balance through that instant.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Current or as-of account balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  responses:
    BadRequest:
      description: Invalid request or domain invariant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Requested resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Idempotency payload conflict or stale account version
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: Repository query failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    AccountCreated:
      type: object
      required: [account_id]
      properties:
        account_id: { type: string, format: uuid }
    TransactionCreated:
      type: object
      required: [transaction_id]
      properties:
        transaction_id: { type: string, format: uuid }
    Account:
      type: object
      required: [account_id, owner_id, currency, type, status, version]
      properties:
        account_id: { type: string, format: uuid }
        owner_id: { type: string }
        currency: { type: string }
        type: { type: string, enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE] }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        version: { type: integer, format: int64, minimum: 0 }
    Entry:
      type: object
      required: [entry_id, account_id, created_at, amount, direction, currency]
      properties:
        entry_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        amount: { type: string, description: Exact decimal }
        direction: { type: string, enum: [DEBIT, CREDIT] }
        currency: { type: string }
    Transaction:
      type: object
      required: [transaction_id, idempotency_key, description, status, entries]
      properties:
        transaction_id: { type: string, format: uuid }
        reversal_of: { type: string, format: uuid }
        idempotency_key: { type: string }
        description: { type: string }
        status: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/Entry' }
    Balance:
      type: object
      required: [account_id, available, currency]
      properties:
        account_id: { type: string, format: uuid }
        available: { type: string, description: Exact debit-minus-credit decimal }
        currency: { type: string }
    TrialBalanceRow:
      type: object
      required: [account_id, currency, balance]
      properties:
        account_id: { type: string, format: uuid }
        currency: { type: string }
        balance: { type: string, description: Exact debit-minus-credit decimal }
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        request_id: { type: string }
x-planned-capabilities:
  description: Not implemented in this API version; these routes are roadmap only.
  items: []
