openapi: 3.0.3
info:
  title: Double-Entry Ledger API
  version: 1.0.0
  description: >-
    Current routes are implemented and documented below. Planned capabilities are
    listed separately and are not callable until implemented and published.
servers:
  - url: http://localhost:8101
paths:
  /v1/accounts:
    post:
      operationId: createAccount
      summary: Explicitly provision an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, currency, type]
              properties:
                account_id: { type: string, format: uuid }
                owner_id: { type: string }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                type: { type: string, enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE] }
      responses:
        '201': { description: Account created or identical account already exists }
        '400': { description: Invalid account attributes or ID conflict }
  /v1/transactions:
    post:
      operationId: postTransaction
      summary: Record a balanced transaction
      description: >-
        A same-key, same-payload retry returns the original transaction; changed
        payload conflicts with HTTP 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key, entries]
              properties:
                idempotency_key: { type: string }
                expected_versions:
                  type: object
                  additionalProperties: { type: integer, format: int64, minimum: 0 }
                  description: Optional account_id to version preconditions; stale versions return 409.
                description: { type: string }
                entries:
                  type: array
                  items:
                    type: object
                    required: [account_id, amount, direction, currency]
                    properties:
                      account_id: { type: string, format: uuid }
                      amount: { type: string, description: Exact decimal; JSON decimal input is accepted by the implementation. }
                      direction: { type: string, enum: [DEBIT, CREDIT] }
                      currency: { type: string, pattern: '^[A-Z]{3}$' }
      responses:
        '200':
          description: Transaction posted
          content:
            application/json:
              schema:
                type: object
                required: [transaction_id]
                properties:
                  transaction_id: { type: string, format: uuid }
        '400': { description: Invalid JSON, account id, direction, or journal invariants }
        '409': { description: Idempotency payload conflict or stale account version }
  /v1/transactions/{id}:
    get:
      operationId: getTransactionByID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Transaction and journal entries }
        '400': { description: Invalid transaction UUID }
        '404': { description: Transaction not found }
  /v1/transactions/by-idempotency-key/{key}:
    get:
      operationId: getTransactionByIdempotencyKey
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string }
      responses:
        '200': { description: Transaction and journal entries }
        '404': { description: Transaction not found }
  /v1/transactions/{id}/reversals:
    post:
      operationId: reverseTransaction
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key]
              properties:
                idempotency_key: { type: string }
      responses:
        '200': { description: Reversal transaction ID; retries return the original result }
        '400': { description: Invalid original transaction or reversal request }
        '409': { description: Idempotency key payload conflict }
  /v1/accounts/{id}:
    get:
      operationId: getAccount
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Account definition and current concurrency version }
        '400': { description: Invalid account UUID }
        '404': { description: Account not found }
  /v1/accounts/{id}/entries:
    get:
      operationId: getAccountEntries
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
        - in: query
          name: offset
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200': { description: Account entries in deterministic order }
        '400': { description: Invalid account id or pagination }
  /v1/trial-balance:
    get:
      operationId: getTrialBalance
      responses:
        '200': { description: Per-account debit-minus-credit balances }
        '500': { description: Query failed }
  /v1/accounts/{id}/balance:
    get:
      operationId: getAccountBalance
      summary: Read an account balance
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: as_of
          description: Optional RFC3339 timestamp; returns balance through that instant.
          schema: { type: string, format: date-time }
      responses:
        '200': { description: Current or as-of account balance }
        '400': { description: Account id is not a UUID }
        '500': { description: Balance query failed }
components:
  schemas:
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        request_id: { type: string }
x-planned-capabilities:
  description: Not implemented in this API version; these routes are roadmap only.
  items: []
